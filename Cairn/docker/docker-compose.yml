version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cairn-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=cairn
      - DB_PASSWORD=${DB_PASSWORD:-cairn_dev_password}
      - DB_NAME=cairn
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-please}
      - CAIRN_TELEMETRY_API_KEY=${CAIRN_TELEMETRY_API_KEY:-dev-telemetry-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8082,http://localhost:19006}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - cairn-network

  db:
    image: mysql:8.0
    container_name: cairn-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_dev_password}
      - MYSQL_DATABASE=cairn
      - MYSQL_USER=cairn
      - MYSQL_PASSWORD=${DB_PASSWORD:-cairn_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_dev_password}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - cairn-network

volumes:
  mysql_data:
    driver: local

networks:
  cairn-network:
    driver: bridge
